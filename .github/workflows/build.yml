name: build

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'  # Weekly rebuild on Sundays

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

env:
  REPO_NAME: coolguy565
  GH_REPO: coolguy565/coolguy565.github.io
  PACKAGER_NAME: ${{ secrets.PACKAGER_NAME }}
  PACKAGER_EMAIL: ${{ secrets.PACKAGER_EMAIL }}
  GPGKEY: ${{ secrets.GPGKEY }}
  RELEASE_TAG: coolguy565
  SIGN_PACKAGES: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:base-devel
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for multi-arch (optional)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/pacman/pkg
            /home/builder/.cache
          key: pacman-${{ runner.os }}-${{ hashFiles('packages/**/PKGBUILD') }}
          restore-keys: |
            pacman-${{ runner.os }}-

      - name: Cache GPG home
        uses: actions/cache@v4
        if: env.SIGN_PACKAGES == 'true'
        with:
          path: ~/.gnupg
          key: gpg-${{ runner.os }}-${{ secrets.GPGKEY }}
          restore-keys: |
            gpg-${{ runner.os }}-

      - name: Update system and install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel git gnupg sudo github-cli python3 jq

      - name: Fetch existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "coolguy565 pacman repo" || true
          mkdir -p repo
          gh release download "$RELEASE_TAG" --dir repo \
            --pattern '*.pkg.tar.zst*' --pattern '*.db.tar.gz*' --pattern '*.asc' \
            --pattern 'build-manifest.json' 2>/dev/null || true
          ls -la repo/ 2>/dev/null || true

      - name: Create builder user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build packages and create repo
        env:
          GPG_KEY_B64: ${{ secrets.GPG_KEY_B64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SIGN_PACKAGES: ${{ env.SIGN_PACKAGES }}
        run: |
          su builder -c "cd \"$GITHUB_WORKSPACE\" && ./build.sh"

      - name: Publish to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            "repo/$REPO_NAME.db" "repo/$REPO_NAME.db.sig" \
            "repo/$REPO_NAME.db.tar.gz" "repo/$REPO_NAME.db.tar.gz.sig" \
            "repo/$REPO_NAME.files.tar.gz" "repo/$REPO_NAME.files.tar.gz.sig" \
            "repo/$REPO_NAME.asc" "repo/build-manifest.json" \
            packages/*/*.pkg.tar.zst packages/*/*.pkg.tar.zst.sig 2>/dev/null || true

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: true
          cname: coolguy565.github.io

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            repo/build-manifest.json
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint build.sh
        run: shellcheck build.sh

      - name: Lint PKGBUILDs
        run: |
          for pkg in packages/*/PKGBUILD; do
            echo "Linting $pkg"
            shellcheck "$pkg" || true
            namcap "$pkg" 2>/dev/null || true
          done
        continue-on-error: true